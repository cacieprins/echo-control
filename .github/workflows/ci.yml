name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra cpu

      - name: ruff and basedpyright
        run: uv run --no-sync pre-commit run --all-files

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 60); do
            curl -fsS http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: pytest
        run: uv run --no-sync pytest
