repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
