# Copy to ~/.config/echo-control/config.toml

[library]
paths = ["~/Music"]
extensions = ["mp3", "flac", "ogg", "opus", "m4a", "wav", "aac", "wma", "aiff"]
rescan_interval = "6h"
exclude = []           # directories to skip; [player].spotatui_dir is always skipped

[model]
# laion/larger_clap_music ships untrained projection weights on Hugging Face; don't use it.
name = "laion/larger_clap_music_and_speech"
device = "auto"        # auto = every GPU (ROCm reports as cuda), else cpu; or "cuda:0,cuda:1"
precision = "bf16"     # bf16 | fp32 for audio on GPU; bf16 is ~4x faster (fp16 produces NaNs)
batch_size = 8
window_seconds = 10.0
# How a track becomes vectors. Changing any of these re-embeds the library on the next scan.
#   chunks:   store every window_seconds window, every hop_seconds, as its own point with its
#             position, loudness and speed through embedding space, in <collection>_chunks
#             and <collection>_tracks (required for --wander, --orbit, --continuous).
#             Uncapped: ~4x the embedding work of clusters for typical tracks, far more for
#             long mixes. max_* and merge_* don't apply.
#   clusters: embed every window_seconds chunk, k-means them, store up to max_clusters
#             centroids per track; a query matches a track's best section.
#   mean:     average `windows` evenly spaced clips into a single vector (faster, blurrier).
strategy = "chunks"
hop_seconds = 2.5         # chunks strategy only
edge_seconds = 30.0       # chunks: length of the intro/outro used by vibe --wander
max_clusters = 4
min_cluster_share = 0.12  # drop sections covering less of the track than this (intros, applause)
merge_threshold = 0.85    # merge centroids at least this similar; uniform tracks end up with one
max_chunks = 60           # longer tracks are subsampled evenly to this many chunks
silence_db = -45.0        # chunks quieter than this (RMS dBFS) are ignored (flagged, for chunks)
windows = 3               # mean strategy only
text_prefix = "A recording of "   # prepended to queries unless already present; "" to disable

[qdrant]
url = "http://localhost:6333"
collection = "echo_control"
ready_timeout = 60     # seconds to wait for qdrant at daemon startup

[search]
# Re-rank by max(similarity * share ** share_weight), where share is how much of the track a
# centroid covers. 0 = pure best-section match (best in testing); 0.5 already over-rewards
# uniform tracks.
share_weight = 0.0
# chunks strategy: rank tracks by their mean similarity over their best
# round(sustain_seconds / hop_seconds) non-silent windows. <= hop_seconds = the single best
# window; 10s at 2.5s hop = 4 windows; larger = the vibe must be sustained.
sustain_seconds = 60

[wander]
# vibe --wander chains tracks by scoring each candidate's intro against the current outro:
#   position * cosine(outro, intro) + direction * cosine(outro heading, intro heading)
#   + drift * -|log(outro drift / intro drift)|  (how fast each edge moves through the space)
position = 1.0
direction = 0.5
drift = 0.25
candidates = 100          # nearest intros considered at each step (and, for --orbit,
                          # tracks nearest the center); --orbit=N adds N * center similarity
# Never pick another file of a track already in the walk. Pairs at least
# duplicate_similarity alike overall or at the intro get their windows compared in time
# order over the stretch they share; at least duplicate_alignment means the same recording.
# Copies (other encodes, remasters, compilation versions, truncated files) line up at
# ~0.94-1.0, similar tracks from one album at ~0.86-0.87.
duplicate_similarity = 0.95
duplicate_alignment = 0.92

[player]
backend = "mpv"        # mpv | spotatui | command | stdout
limit = 25
command = "mpv --playlist={m3u}"   # used by backend = "command"; {m3u} or {paths}
# spotatui has no CLI for local playlists; results become a folder of ordered symlinks here,
# which its Local Files source lists as a playlist. Must be under spotatui's local_music_path.
spotatui_dir = "~/Music/vibe-playlists"
spotatui_keep = 10
