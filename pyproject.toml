[project]
name = "echo-control"
version = "0.1.0"
description = "Walk a local music library along smooth trajectories in CLAP audio embedding space with Qdrant"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=4.44",
    "librosa>=0.10",
    "soundfile>=0.12",
    "qdrant-client>=1.12",
    "watchdog>=5.0",
]

[project.optional-dependencies]
rocm = [
    "torch==2.14.0",
    "triton-rocm==3.8.0; sys_platform == 'linux'",
]
cuda = ["torch==2.14.0"]
cpu = ["torch==2.14.0"]

[project.scripts]
vibe = "echo_control.cli:vibe"
echo-control = "echo_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_control"]

[tool.hatch.build.targets.wheel.force-include]
"contrib" = "echo_control/contrib"

[tool.uv]
conflicts = [[{ extra = "rocm" }, { extra = "cuda" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-cpu", extra = "cpu" },
]
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.basedpyright]
# numpy, torch and Qdrant payloads are Any-typed throughout; the Any rules can't be met
# without a cast on every array expression.
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests requiring a running Qdrant server on localhost:6333",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
